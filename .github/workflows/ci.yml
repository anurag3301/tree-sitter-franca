name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{matrix.grammar}} (${{matrix.os}})
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        grammar: [., fdepl]
    steps:
      - uses: actions/checkout@v6
      - uses: tree-sitter/setup-action/cli@v2
      - name: Generate and test
        working-directory: ${{matrix.grammar}}
        run: |
          tree-sitter generate
          tree-sitter test

  query:
    name: Validate queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tree-sitter/setup-action/cli@v2
      - name: Build parsers
        run: |
          mkdir -p "$HOME/.local/share/nvim/site/parser"
          (cd . && tree-sitter build -o "$HOME/.local/share/nvim/site/parser/franca.so")
          (cd fdepl && tree-sitter build -o "$HOME/.local/share/nvim/site/parser/fdepl.so")
      - name: Set up ts_query_ls
        run: curl -fL https://github.com/ribru17/ts_query_ls/releases/latest/download/ts_query_ls-x86_64-unknown-linux-gnu.tar.gz | tar -xz
      - name: Check, lint and format queries
        run: |
          ./ts_query_ls check queries fdepl/queries
          ./ts_query_ls lint queries fdepl/queries
          ./ts_query_ls format --check queries fdepl/queries
